# Continuous integration: the same three gates used locally before
# every commit — formatting, lints as errors across all targets, and
# the full test suite (which also compiles the benchmarks).
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      # Backend features compile to safe stubs off macOS; this keeps
      # the stubs honest.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # The backend features are real only on macOS; this job runs the
  # accelerate grid, determinism, and end-to-end training tests on
  # Apple hardware.
  check-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features accelerate -- -D warnings
      - run: cargo test --all-targets --features accelerate

# Continuous integration: the same gates used locally before every
# commit — formatting, lints as errors across all targets (which also
# compile the benchmarks), and the test suite including doctests. The
# test steps name their targets: `--all-targets` implies `--benches`,
# which would execute every Criterion binary in test mode regardless
# of the targets' `test = false`.
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib --tests --examples
      # Named targets omit doctests, so they get their own run.
      - run: cargo test --doc
      # Backend features compile to safe stubs off macOS; this keeps
      # the stubs honest.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # The backend features are real only on macOS; this job runs the
  # accelerate and metal grids, determinism, and end-to-end training
  # tests on Apple hardware. The macos-26 image exposes the
  # paravirtualized GPU (macos-14 reported no Metal device); the GPU
  # tests skip cleanly wherever the device is missing.
  check-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features accelerate,metal -- -D warnings
      - run: cargo test --lib --tests --examples --features accelerate,metal
      - run: cargo test --doc --features accelerate,metal

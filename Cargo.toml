[package]
name = "poorgrad"
version = "0.5.4"
edition = "2024"
description = "A poor man's autograd: a tiny autograd engine for the GPU-poor, written in idiomatic Rust."
readme = "README.md"
repository = "https://github.com/shergin/poorgrad"
documentation = "https://docs.rs/poorgrad"
license = "MIT OR Apache-2.0"
keywords = ["autograd", "autodiff", "backpropagation", "machine-learning", "educational"]
categories = ["science", "mathematics"]

# The default libtest bench harness would intercept criterion's CLI
# flags (such as `--save-baseline`), so benchmarks run only through the
# explicit `[[bench]]` targets below. Each also sets `test = false`:
# plain `cargo test` would otherwise execute every Criterion binary in
# its test mode, turning the test gate into an uncontrolled performance
# workload. An explicit `--benches` (or `--all-targets`) still forces
# them in, so CI names its test targets instead; clippy's
# `--all-targets` remains the benchmarks' compile gate.
[lib]
bench = false

# One codegen unit keeps benchmark comparisons meaningful across
# commits: default partitioning shifts with unrelated edits and can
# swing tight loops by tens of percent, masquerading as regressions.
[profile.bench]
codegen-units = 1

[dependencies]
cow_vec = "1.4"
matrixmultiply = { version = "0.3.11", optional = true }
smallvec = "1.15.2"
static_assertions = "1.1"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
rayon = "1.12.0"

[features]
# Routes dense `f32`/`f64` matrix products above a small threshold to
# Apple's Accelerate framework (the AMX/SME matrix units on Apple
# Silicon, AVX kernels on Intel Macs). macOS only; a safe stub
# elsewhere. Zero dependencies: one linked system framework.
accelerate = []

# Routes very large dense `f32` products (Metal has no `f64`) to the
# GPU through hand-written simdgroup-matrix kernels, compiled from
# source at first use. macOS only; a safe stub elsewhere.
metal = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]

# Routes dense `f32`/`f64` matrix products above a small threshold to
# the `matrixmultiply` crate's hand-tuned microkernels (runtime
# AVX-512F/AVX2+FMA/NEON dispatch, single-threaded). Every platform;
# the portable acceleration rung for Linux and everyone else.
simd = ["dep:matrixmultiply"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-metal = { version = "0.3", optional = true }

# Feature-gated items exist in every build (behavior changes, surface
# does not), so docs render completely either way; all-features only
# lets behavior notes mention the features as enabled.
[package.metadata.docs.rs]
all-features = true

# The makemore examples live in a subfolder together with their shared
# corpus module and dataset, so each target is declared explicitly;
# auto-discovery only finds top-level example files.
[[example]]
name = "makemore_bigram"
path = "examples/makemore/bigram.rs"

[[example]]
name = "makemore_mlp"
path = "examples/makemore/mlp.rs"

[[example]]
name = "makemore_mlp_facade"
path = "examples/makemore/mlp_facade.rs"

[[example]]
name = "makemore_mlp_parallel"
path = "examples/makemore/mlp_parallel.rs"

[[example]]
name = "makemore_embedding_map"
path = "examples/makemore/embedding_map.rs"

[[bench]]
name = "record"
harness = false
test = false

[[bench]]
name = "run"
harness = false
test = false

[[bench]]
name = "train"
harness = false
test = false

[[bench]]
name = "scale"
harness = false
test = false

[[bench]]
name = "gemm"
harness = false
test = false

[[bench]]
name = "elementwise"
harness = false
test = false

[[bench]]
name = "memory"
harness = false
test = false
